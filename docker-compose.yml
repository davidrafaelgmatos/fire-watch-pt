version: "3.9"

services:
  db:
    env_file:
      - .env
    image: postgres:15
    container_name: firewatch-db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: firewatch-backend
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: firewatch-frontend
    env_file: .env
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data:
